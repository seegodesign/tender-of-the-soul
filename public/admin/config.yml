backend:
  name: github
  repo: seegodesign/tender-of-the-soul
  branch: main
  base_url: https://tender-of-the-soul-sveltia-cms-auth.seegodesign.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads
site_url: https://REPLACE_WITH_PRODUCTION_DOMAIN
display_url: https://REPLACE_WITH_PRODUCTION_DOMAIN
logo_url: /favicon.svg

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in the page URL." }
      - { label: Publish date, name: publishDate, widget: datetime, time_format: false }
      - { label: Updated date, name: updatedDate, widget: datetime, required: false, time_format: false }
      - { label: Author, name: author, widget: string, default: Elana }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Featured image, name: featuredImage, widget: image, required: false }
      - { label: Featured image alt text, name: featuredImageAlt, widget: string, required: false }
      - { label: Category, name: category, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: SEO title, name: seoTitle, widget: string, required: false }
      - { label: Meta description, name: metaDescription, widget: text, required: false }
      - { label: Social sharing image, name: socialImage, widget: image, required: false }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Body content, name: body, widget: markdown }
  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    extension: md
    fields:
      - { label: Client first name or initials, name: clientName, widget: string }
      - { label: Client descriptor, name: descriptor, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Display order, name: order, widget: number, value_type: int }
      - { label: Placeholder, name: placeholder, widget: boolean, default: false }
      - { label: Testimonial, name: body, widget: text }
  - name: faqs
    label: FAQs
    folder: src/content/faqs
    create: true
    extension: md
    fields:
      - { label: Question, name: question, widget: string }
      - { label: Category, name: category, widget: select, options: [Hakomi, Sessions, Practice, General] }
      - { label: Display order, name: order, widget: number, value_type: int }
      - { label: Answer, name: body, widget: markdown }
  - name: pages
    label: Pages
    files:
      - label: Home
        name: home
        file: src/data/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Introduction, name: introduction, widget: text }
              - { label: Primary button label, name: primaryCta, widget: string }
              - { label: Secondary button label, name: secondaryCta, widget: string }
              - { label: Location line, name: locationLine, widget: string }
              - { label: Hero image alt text, name: imageAlt, widget: string }
          - label: Welcome
            name: welcome
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Core statement, name: statement, widget: text }
              - { label: Body, name: body, widget: text }
              - { label: Link label, name: linkLabel, widget: string }
          - label: Beyond understanding
            name: insight
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: First paragraph, name: paragraphOne, widget: text }
              - { label: Second paragraph, name: paragraphTwo, widget: text }
              - { label: Link label, name: linkLabel, widget: string }
              - { label: Diagram first label, name: diagramLabelOne, widget: string }
              - { label: Diagram second label, name: diagramLabelTwo, widget: string }
          - label: Approach
            name: approach
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: introduction, widget: text }
              - label: Principles
                name: principles
                widget: list
                min: 1
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Permission structure
            name: permission
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: First paragraph, name: paragraphOne, widget: text }
              - { label: Second paragraph, name: paragraphTwo, widget: text }
              - { label: Quote, name: quote, widget: text }
              - { label: Attribution, name: attribution, widget: string }
          - label: Possibilities
            name: possibility
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Possibility statements, name: items, widget: list, field: { label: Statement, name: statement, widget: string } }
          - label: Sessions preview
            name: sessions
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: introduction, widget: text }
              - { label: Button label, name: buttonLabel, widget: string }
              - { label: Card heading, name: cardHeading, widget: string }
              - { label: Session details, name: items, widget: list, field: { label: Detail, name: detail, widget: string } }
      - label: About
        name: about
        file: src/data/about.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - label: Page introduction
            name: hero
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Introduction, name: introduction, widget: text }
          - label: Practitioner portrait
            name: portrait
            widget: object
            fields:
              - { label: Portrait image, name: image, widget: image, required: false }
              - { label: Image alt text, name: altText, widget: string }
              - { label: Placeholder heading, name: placeholderHeading, widget: string }
              - { label: Placeholder note, name: placeholderNote, widget: string }
          - label: About Elana
            name: introduction
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Practitioner statement, name: statement, widget: text }
              - { label: First paragraph, name: paragraphOne, widget: text }
              - { label: Second paragraph, name: paragraphTwo, widget: text }
          - label: Orientation
            name: orientation
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead statement, name: statement, widget: text }
              - { label: Body, name: body, widget: text }
          - label: Training and background
            name: credentials
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: introduction, widget: text }
              - label: Practice details
                name: items
                widget: list
                min: 1
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: description, widget: text }
      - label: Contact
        name: contact
        file: src/data/contact.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Meta description, name: description, widget: text }
          - label: Page introduction
            name: hero
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Introduction, name: introduction, widget: text }
          - label: Discovery call introduction
            name: introduction
            widget: object
            fields:
              - { label: Kicker, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Body, name: body, widget: text }
          - label: Practice details
            name: details
            widget: list
            min: 1
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
          - label: Urgent-support notice
            name: urgentNotice
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Body, name: body, widget: text }
          - label: Contact form
            name: form
            widget: object
            fields:
              - { label: First-name label, name: firstNameLabel, widget: string }
              - { label: Last-name label, name: lastNameLabel, widget: string }
              - { label: Email label, name: emailLabel, widget: string }
              - { label: Phone label, name: phoneLabel, widget: string }
              - { label: Optional-field label, name: optionalLabel, widget: string }
              - { label: Meeting preference question, name: meetingLegend, widget: string }
              - label: Meeting options
                name: meetingOptions
                widget: list
                min: 1
                fields:
                  - { label: Visible label, name: label, widget: string }
                  - { label: Form value, name: value, widget: string, hint: "Use lowercase letters and hyphens. This is included in form submissions." }
              - { label: Message-field label, name: messageLabel, widget: string }
              - { label: Message guidance, name: messageGuidance, widget: string }
              - { label: Consent text, name: consentLabel, widget: text }
              - { label: Submit-button label, name: buttonLabel, widget: string }
              - { label: Privacy-note introduction, name: privacyPrefix, widget: text }
              - { label: Privacy-policy link label, name: privacyLinkLabel, widget: string }
  - name: settings
    label: Site settings
    files:
      - label: Global settings
        name: global
        file: src/data/site.json
        fields:
          - { label: Practice name, name: practiceName, widget: string }
          - { label: Practitioner name, name: practitionerName, widget: string }
          - { label: Email address, name: email, widget: string }
          - { label: Phone number, name: phone, widget: string, required: false }
          - { label: Location, name: location, widget: string }
          - { label: Social links, name: socialLinks, widget: list, required: false }
          - { label: Discovery call CTA label, name: discoveryCallLabel, widget: string }
          - { label: Contact form heading, name: contactFormHeading, widget: string }
          - { label: Contact form introduction, name: contactFormIntroduction, widget: text }
          - { label: Default SEO title, name: defaultSeoTitle, widget: string }
          - { label: Default meta description, name: defaultMetaDescription, widget: text }
          - { label: Default social image, name: defaultSocialImage, widget: image }
          - { label: Footer disclaimer, name: footerDisclaimer, widget: text }
          - { label: Crisis-support disclaimer, name: crisisDisclaimer, widget: text }
